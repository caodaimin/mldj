<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小程序需求工具台原型</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #1f2a37;
        --subtle: #6b7280;
        --primary: #2563eb;
        --primary-soft: #eff6ff;
        --hot: #ef4444;
        --radius: 14px;
        --shadow: 0 8px 24px rgba(31, 42, 55, 0.08);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .page {
        max-width: 760px;
        margin: 0 auto;
        padding: 20px 16px 110px;
      }

      .search-box {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 12px;
      }

      .search-box input {
        width: 100%;
        border: 1px solid #dbe2ea;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 15px;
        outline: none;
      }

      .search-box input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .banner {
        margin-top: 14px;
        display: grid;
        gap: 10px;
      }

      .banner-item {
        background: linear-gradient(135deg, #1d4ed8, #60a5fa);
        color: #fff;
        border-radius: var(--radius);
        padding: 14px 16px;
        font-weight: 600;
        box-shadow: var(--shadow);
      }

      h2 {
        font-size: 18px;
        margin: 24px 4px 12px;
      }

      .tools {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .tool-card {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 14px;
        min-height: 94px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .tool-title {
        font-weight: 600;
        line-height: 1.4;
      }

      .tag {
        width: fit-content;
        margin-top: 10px;
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary);
      }

      .tag.convert { background: #fff7ed; color: #ea580c; }
      .tag.trust { background: #f0fdf4; color: #16a34a; }
      .tag.filter { background: #faf5ff; color: #9333ea; }

      .hot-list {
        display: grid;
        gap: 10px;
      }

      .hot-item {
        background: var(--card);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 12px 14px;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--hot);
      }

      .bottom-cta {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(6px);
        border-top: 1px solid #e5e7eb;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      }

      .cta-inner {
        max-width: 760px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .btn {
        border: none;
        border-radius: 10px;
        padding: 12px 8px;
        font-size: 14px;
        font-weight: 600;
      }

      .btn.primary {
        background: var(--primary);
        color: #fff;
      }

      .btn.secondary {
        background: #111827;
        color: #fff;
      }

      @media (max-width: 520px) {
        .tools { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="search-box">
        <input type="text" placeholder="你想做什么小程序/功能（外卖/预约/商城/报名/工具…）" />
      </section>

      <section class="banner" aria-label="轮播Banner（原型展示）">
        <div class="banner-item">① 免费生成需求文档</div>
        <div class="banner-item">② 1分钟出报价区间</div>
        <div class="banner-item">③ 领取模板资料</div>
      </section>

      <h2>核心工具区</h2>
      <section class="tools">
        <article class="tool-card">
          <div class="tool-title">需求单生成器</div>
          <span class="tag">爆款</span>
        </article>
        <article class="tool-card">
          <div class="tool-title">报价区间计算器</div>
          <span class="tag">爆款</span>
        </article>
        <article class="tool-card">
          <div class="tool-title">功能清单模板库</div>
          <span class="tag">爆款</span>
        </article>
        <article class="tool-card">
          <div class="tool-title">备案/主体/类目自查</div>
          <span class="tag convert">强转化</span>
        </article>
        <article class="tool-card">
          <div class="tool-title">竞品小程序参考库</div>
          <span class="tag trust">强信任</span>
        </article>
        <article class="tool-card">
          <div class="tool-title">开发周期评估</div>
          <span class="tag filter">强筛选</span>
        </article>
      </section>

      <h2>今日热门</h2>
      <section class="hot-list">
        <div class="hot-item"><span class="dot"></span>预约类小程序需求模板</div>
        <div class="hot-item"><span class="dot"></span>商城小程序报价区间</div>
        <div class="hot-item"><span class="dot"></span>同城服务小程序怎么做</div>
      </section>
    </main>

    <footer class="bottom-cta">
      <div class="cta-inner">
        <button class="btn primary">免费领取《小程序需求文档Word》</button>
        <button class="btn secondary">加微信咨询（弹出二维码/复制微信号）</button>
      </div>
    </footer>
  </body>
</html>
